[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leia-vfm-ssl-benchmark"
version = "0.1.0"
description = "Small reproducible benchmark for semi-supervised medical segmentation in the vision foundation model era"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "nibabel>=5.2",
  "PyYAML>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
]

[project.optional-dependencies]
lidc = [
  "pylidc==0.2.3",
  "pydicom>=2.4",
  "Pillow>=10.0",
]
yolo = [
  "ultralytics",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
