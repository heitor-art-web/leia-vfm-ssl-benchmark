name: freeze-lidc-splits

on:
  workflow_dispatch:
  push:
    branches: [feat/lidc-phase0]
    paths:
      - .github/workflows/freeze-lidc-splits.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lidc-phase0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install metadata dependencies
        run: python -m pip install --upgrade pip numpy huggingface_hub
      - name: Download pinned public metadata
        env:
          PYTHONPATH: src
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: >-
          python scripts/bootstrap_lidc_hf.py
          --metadata-only
          --output /tmp/lidc_bootstrap
      - name: Rebuild deterministic v1 manifest
        env:
          PYTHONPATH: src
        run: >-
          python scripts/build_lidc_split_manifests.py
          --scans /tmp/lidc_bootstrap/scans.csv
          --source-json /tmp/lidc_bootstrap/SOURCE.json
          --out /tmp/lidc_splits
      - name: Freeze compact manifest and summary
        run: |
          mkdir -p splits/lidc/v1
          cp /tmp/lidc_splits/manifest.json splits/lidc/v1/manifest.json
          cp /tmp/lidc_splits/summary.json splits/lidc/v1/summary.json
      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add splits/lidc/v1/manifest.json splits/lidc/v1/summary.json
          if git diff --cached --quiet; then
            echo "Frozen manifest already matches the generator."
            exit 0
          fi
          git commit -m "Freeze LIDC v1 patient manifests"
          git push origin HEAD:feat/lidc-phase0
