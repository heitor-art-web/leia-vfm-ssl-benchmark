name: free-preflight

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_ultralytics_semantic_contract.py"
      - "scripts/export_lidc_mirror_benchmark.py"
      - "splits/lidc/v1/**"
      - "pyproject.toml"
      - ".github/workflows/free-preflight.yml"
  pull_request:
    paths:
      - "scripts/check_ultralics_semantic_contract.py"
      - "scripts/export_lidc_mirror_benchmark.py"
      - "splits/lidc/v1/**"
      - "pyproject.toml"
      - ".github/workflows/free-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ultralytics
        run: pip install --disable-pip-version-check --no-cache-dir ultralytics==8.4.163
      - name: Verify ignore-label contract
        run: python scripts/check_ultralytics_semantic_contract.py

  frozen-matrix-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata planner dependency
        run: pip install --disable-pip-version-check --no-cache-dir "huggingface_hub>=0.25" nibabel numpy pillow pyyaml
      - name: Generate all frozen supervised plans without CT downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/leia-plans
          for seed in 1337 2026 31415; do
            for budget in 001pct 005pct 010pct 025pct; do
              out="/tmp/leia-plans/seed${seed}_${budget}"
              python scripts/export_lidc_mirror_benchmark.py \
                --output "$out" \
                --seed "$seed" \
                --budget "$budget" \
                --splits train val \
                --metadata-only
            done
          done
      - name: Verify plan invariants
        shell: python
        run: |
          from pathlib import Path
          import csv

          root = Path('/tmp/leia-plans')
          plans = sorted(root.glob('*/export_plan.csv'))
          assert len(plans) == 12, len(plans)
          for path in plans:
              with path.open(newline='', encoding='utf-8') as fh:
                  rows = list(csv.DictReader(fh))
              assert rows, path
              train = {r['patient_id'] for r in rows if r['split'] == 'train'}
              val = {r['patient_id'] for r in rows if r['split'] == 'val'}
              assert train
              assert len(val) == 152, (path, len(val))
              assert train.isdisjoint(val), path
              assert all(int(r['n_slices']) > 0 for r in rows), path
          print('All 12 frozen SUP plans passed patient-isolation and slice-count checks.')
      - name: Upload metadata-only plans
        uses: actions/upload-artifact@v4
        with:
          name: frozen-sup-matrix-plans
          path: /tmp/leia-plans
          retention-days: 14
