name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run unit tests
        run: pytest -q
