name: web-ci

on:
  push:
    branches: [main, feat/lidc-phase0]
    paths:
      - "web/**"
      - "scripts/sync_showcase_qc_assets.py"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/sync_showcase_qc_assets.py"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Type-check and build showcase
        working-directory: web
        run: npm run build
